<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-white">

    <div class="flex h-screen">

        <!-- SIDEBAR -->
        <aside class="w-64 border-r border-gray-200 flex flex-col">

            <!-- Logo -->
            <div class="p-5 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-violet-600">
                    Bookshop Admin
                </h2>
            </div>


            <!-- Menu -->
            <nav class="flex-1 overflow-y-auto p-4 space-y-2 text-sm">

                <a href="{% url 'admin_dashboard' %}"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Dashboard
                </a>

                <a href="{% url 'admin_books' %}"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Books
                </a>

                <a href="{% url 'admin_authors' %}"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Authors
                </a>

                <a href="{% url 'admin_generes' %}"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Categories
                </a>

                <a href="{% url 'admin_coupons' %}"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Coupons
                </a>

                <a href="#"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Orders
                </a>

                <a href="#"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Users
                </a>

                <a href="#"
                    class="block px-4 py-2 rounded border border-transparent hover:border-violet-500 hover:text-violet-600">
                    Settings
                </a>

            </nav>


            <!-- Logout -->
            <div class="p-4 border-t border-gray-200">
                <button
                    class="w-full border border-red-500 text-red-500 py-2 rounded hover:bg-red-500 hover:text-white text-sm">
                    Logout
                </button>

            </div>

        </aside>


        <!-- MAIN -->
        <div class="flex-1 flex flex-col">

            <!-- HEADER -->
            <header class="border-b border-gray-200 px-6 py-4 flex justify-between items-center">

                <h1 class="text-lg font-semibold">
                    {{ title }}
                </h1>

                <div class="flex items-center gap-4">

                    <input type="text" placeholder="Search..."
                        class="border border-gray-300 px-3 py-2 rounded focus:outline-none focus:border-violet-500">

                    <div class="text-sm text-gray-600">
                        Admin
                    </div>

                </div>

            </header>


            <!-- CONTENT -->
            <main class="flex-1 p-6 overflow-y-auto">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

</body>

</html>
