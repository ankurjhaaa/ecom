{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white border border-gray-200 rounded-lg">
        <div class="p-4 border-b border-gray-200">
            <h2 class="text-md font-semibold text-gray-700">Login</h2>
        </div>

        <form method="POST" class="p-4 space-y-4">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            {{ form|crispy }}

            <button type="submit" class="w-full bg-violet-600 text-white py-2 rounded hover:bg-violet-700">
                Login
            </button>

            <p class="text-sm text-gray-600 text-center">
                New user?
                <a href="{% url 'signup' %}" class="text-violet-600 hover:underline">Create account</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
