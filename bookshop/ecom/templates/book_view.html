{% extends 'base.html' %}

{% block content %}
  <div class="max-w-7xl mx-auto">
    <div class="grid md:grid-cols-2 gap-10 border border-gray-200 rounded-lg p-6">
      <div class="border border-gray-200 rounded-lg overflow-hidden">
        <img src="{{ book.cover_image.url }}" class="w-full h-full object-cover" />
      </div>

      <div>
        <h1 class="text-2xl font-semibold text-violet-600 mb-2">{{ book.title }}</h1>

        <p class="text-sm text-gray-600 mb-3">Author: {{ book.author.name }}</p>

        <p class="text-xl font-semibold text-violet-600 mb-6">₹{{ book.price }}</p>

        <p class="text-gray-600 mb-6">{{ book.description }}</p>

        <a href="{% url "add_to_cart" book.slug %}" class="px-6 py-3 border border-violet-600 text-violet-600 rounded hover:bg-violet-600 hover:text-white">Add to Cart</a>
      </div>
    </div>

    <div class="mt-14">
      <h2 class="text-xl font-semibold mb-6">Related Products</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        {% for book in related_books %}
          <a href="{% url 'book_view' book.slug %}">
            <div class="border border-gray-200 rounded-lg bg-white overflow-hidden">
            <img src="{{ book.cover_image.url }}" class="w-full h-56 object-cover" />

            <div class="p-4">
              <h3 class="text-md font-semibold text-violet-600 mb-1">{{ book.title }}</h3>

              <p class="text-sm text-gray-600 mb-2">Author: {{ book.author.name }}</p>

              <span class="text-violet-600 font-semibold">₹{{ book.price }}</span>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
{% endblock %}
